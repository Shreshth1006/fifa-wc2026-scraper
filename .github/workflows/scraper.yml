name: FIFA WC 2026 Scraper

on:
  schedule:
    - cron: '30 19 * * *'   # 1:00 AM IST
    - cron: '30 23 * * *'   # 5:00 AM IST
    - cron: '30 2 * * *'    # 8:00 AM IST
    - cron: '30 4 * * *'    # 10:00 AM IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Schedule Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python SCHEDULE.py

      - name: Run Standings Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python POINTS.py

      -