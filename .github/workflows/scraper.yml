name: FIFA WC 2026 Scraper

on:
  schedule:
    - cron: '30 20 * * *'   # 2:00 AM IST
    - cron: '30 0 * * *'    # 6:00 AM IST
    - cron: '30 1 * * *'    # 7:00 AM IST
    - cron: '30 4 * * *'    # 10:00 AM IST
    - cron: '30 5 * * *'    # 11:00 AM IST
    - cron: '30 6 * * *'    # 12:00 PM IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Schedule Updater
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python SCHEDULE.py

    


      
